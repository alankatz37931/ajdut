# CI — lint + typecheck + tests en cada push/PR a main.
# pnpm 9 / node 20 según `engines` de package.json (lockfileVersion 9.0).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `postinstall` corre `prisma generate`, necesario para el typecheck.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
